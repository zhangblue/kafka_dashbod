[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[lib]
name = "kafka_dashboard"

[[bin]]
name = "kafka-dashboard"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
futures = "0.3"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15"
percent-encoding = "2.3"
rustix = { version = "1.1", features = ["fs"] }
rdkafka = { version = "0.39", default-features = false, features = ["cmake-build", "ssl-vendored", "tokio", "tracing"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["full", "test-util"] }
tower-http = { version = "0.7.1", features = ["cors", "trace", "request-id", "limit", "fs"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.28.0", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3"
tower = { version = "0.5.3", features = ["util"] }
