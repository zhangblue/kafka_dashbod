[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[lib]
name = "kafka_dashboard"

[[bin]]
name = "kafka-dashboard"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["full", "test-util"] }
tower-http = { version = "0.7.1", features = ["cors", "trace", "request-id", "limit"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.28.0", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
